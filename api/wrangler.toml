#:schema node_modules/wrangler/config-schema.json
name = "thirisan-store-api"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# The till and the back office are served from Pages on their own origins, so
# every request they make is cross-origin and the allowed list has to be real.
# Set it to the deployed Pages URLs before the shop opens; `*` is refused by
# `cors.ts` whenever credentials are involved, which is always here.
[vars]
ALLOWED_ORIGINS = "https://thirisan-store.pages.dev"
SESSION_HOURS = "14"

# D1 free tier: 5 GB storage, 5 million rows read a day. A corner shop writes a
# few thousand rows a day, so the binding cost of this project is the reads on
# the reports — which is why every report here is a GROUP BY the database does
# rather than rows this Worker pulls across and adds up itself.
# **The database keeps its old name on purpose.** Cloudflare cannot rename a D1
# database, and renaming it here would mean creating a second one and moving
# every row into it — a migration with a window where a sale could be lost, to
# change a string nobody outside this file ever reads. The Worker and the Pages
# project were renamed because their names are the *address*; this one is not.
[[d1_databases]]
binding = "DB"
database_name = "kite-pos"
database_id = "78db975a-0686-4f3a-afa3-534fea17ce80"
migrations_dir = "migrations"

# Product photos. R2's free tier has no egress charge, which is the whole
# reason the pictures live here and not as base64 in a D1 column.
# Same reasoning as the database: the bucket name is not an address, and moving
# the pictures would be work with a risk attached and nothing at the end of it.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "kite-pos-photos"

[observability]
enabled = true

# ---------------------------------------------------------------------------
# A second shop
# ---------------------------------------------------------------------------
#
# One codebase, one deploy per shop. Everything above is Corner Mart; this is
# Khant's, with its own database, its own bucket and its own Pages origin —
# nothing is shared but the code, which is the point: a fix goes to both with
# two deploys and no branch.
#
#     npm run deploy --workspace=@kite-pos/api -- --env khant
#     npx wrangler d1 migrations apply khant-pos --remote
#
# The database is in APAC for the same reason the first one is: a till is a
# round trip per scan, and the shop is in Myanmar.
[env.khant]
name = "khant-pos-api"

[env.khant.vars]
ALLOWED_ORIGINS = "https://khant-pos.pages.dev"
SESSION_HOURS = "14"

[[env.khant.d1_databases]]
binding = "DB"
database_name = "khant-pos"
database_id = "aa734b88-c305-411e-ba5b-49fcd446682f"
migrations_dir = "migrations"

[[env.khant.r2_buckets]]
binding = "PHOTOS"
bucket_name = "khant-pos-photos"

[env.khant.observability]
enabled = true
