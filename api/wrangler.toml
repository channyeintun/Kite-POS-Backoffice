#:schema node_modules/wrangler/config-schema.json
name = "thirisan-store-api"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# The till and the back office are served from Pages on their own origins, so
# every request they make is cross-origin and the allowed list has to be real.
# Set it to the deployed Pages URLs before the shop opens; `*` is refused by
# `cors.ts` whenever credentials are involved, which is always here.
[vars]
ALLOWED_ORIGINS = "https://thirisan-store.pages.dev"
SESSION_HOURS = "14"

# D1 free tier: 5 GB storage, 5 million rows read a day. A corner shop writes a
# few thousand rows a day, so the binding cost of this project is the reads on
# the reports — which is why every report here is a GROUP BY the database does
# rather than rows this Worker pulls across and adds up itself.
#
# Both shops' data lives in Western Europe (`--location weur`), not APAC. The
# shops are in Myanmar, which blocks Cloudflare's Southeast Asia region, so the
# databases were recreated elsewhere on 26 September 2026 and started empty.
[[d1_databases]]
binding = "DB"
database_name = "thirisan-store-db"
database_id = "98f048d9-106b-4f04-aa06-f94864cf470a"
migrations_dir = "migrations"

# Product photos. R2's free tier has no egress charge, which is the whole
# reason the pictures live here and not as base64 in a D1 column.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "thirisan-store-photos-eu"

# Run the Worker next to its database rather than next to the till: every
# request is several D1 round trips, and those are what a far-away Worker pays.
[placement]
mode = "smart"

[observability]
enabled = true

# ---------------------------------------------------------------------------
# A second shop
# ---------------------------------------------------------------------------
#
# One codebase, one deploy per shop. Everything above is Thiri San; this is
# Khant's, with its own database, its own bucket and its own Pages origin —
# nothing is shared but the code, which is the point: a fix goes to both with
# two deploys and no branch.
#
#     npm run deploy --workspace=@kite-pos/api -- --env khant
#     npx wrangler d1 migrations apply khant-pos-db --remote --env khant
[env.khant]
name = "khant-pos-api"

[env.khant.vars]
ALLOWED_ORIGINS = "https://khant-pos.pages.dev"
SESSION_HOURS = "14"

[[env.khant.d1_databases]]
binding = "DB"
database_name = "khant-pos-db"
database_id = "5cc59087-103a-47f4-a6f5-0041e3678426"
migrations_dir = "migrations"

[[env.khant.r2_buckets]]
binding = "PHOTOS"
bucket_name = "khant-pos-photos-eu"

[env.khant.placement]
mode = "smart"

[env.khant.observability]
enabled = true
